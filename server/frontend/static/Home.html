<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/bootstrap.min.css">
<script>

const logout = async (e) => {
  // ... (your logout function remains the same)
  let logout_url = window.location.origin+"/djangoapp/logout";
  const res = await fetch(logout_url, {
    method: "GET",
  });

  const json = await res.json(); // Uncomment this line
  if (json) { // Uncomment this line
    let username = sessionStorage.getItem('username'); // Uncomment this line
    sessionStorage.removeItem('username'); // Uncomment this line
    window.location.href = window.location.origin; // Uncomment this line
    window.location.reload(); // Uncomment this line
    alert("Logging out "+username+"...") // Uncomment this line
  }
  else { // Uncomment this line
    alert("The user could not be logged out.") // Uncomment this line
  }
};

let checkSession = ()=>{
  let curr_user = sessionStorage.getItem("username");
  let loginLogoutDiv = document.getElementById("loginlogout");
  loginLogoutDiv.innerHTML = ''; // Clear previous content

  const buttonBackgroundColor = '#40E0D0'; // Try this darker turquoise
  const buttonBorderColor = '#40E0D0';

  if (curr_user && curr_user !== "") {
    let usernameSpan = document.createElement('span');
    usernameSpan.className = 'nav-link text-white fw-bold me-2';
    usernameSpan.textContent = curr_user;

    let logoutLink = document.createElement('a');
    logoutLink.className = 'btn btn-lg text-white fw-bold';
    logoutLink.style.backgroundColor = buttonBackgroundColor;
    logoutLink.style.borderColor = buttonBorderColor;
    logoutLink.href = '/';
    logoutLink.textContent = 'Logout';
    logoutLink.onclick = logout;

    loginLogoutDiv.appendChild(usernameSpan);
    loginLogoutDiv.appendChild(logoutLink);

  } else {
    let loginLink = document.createElement('a');
    loginLink.className = 'btn btn-lg text-white fw-bold me-2';
    loginLink.style.backgroundColor = buttonBackgroundColor;
    loginLink.style.borderColor = buttonBorderColor;
    loginLink.href = '/login';
    loginLink.textContent = 'Login';

    let registerLink = document.createElement('a');
    registerLink.className = 'btn btn-lg text-white fw-bold';
    registerLink.style.backgroundColor = buttonBackgroundColor;
    registerLink.style.borderColor = buttonBorderColor;
    registerLink.href = '/register';
    registerLink.textContent = 'Register';

    loginLogoutDiv.appendChild(loginLink);
    loginLogoutDiv.appendChild(registerLink);
  }
}
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%; color: white; font-weight: bold;" href="/">Capstone Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger; color: white; font-weight: bold;" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger; color: white; font-weight: bold;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger; color: white; font-weight: bold;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
        </span>
    </div>
  </div>
</nav>
<div class="hero-section">
    <div class="overlay-content">
      <h5 class="hero-title">Welcome to our Dealerships!</h5>
      <a href="/dealers" class="btn btn-primary hero-button" style="background-color: #40E0D0; border-color: #40E0D0; font-weight: bold; color: white;">View Dealerships</a>
    </div>
  </div>
</div>
</body>
</html>
